packages:
  - apps/*
  - packages/*

# Supply-chain cooldown: ignore registry versions published < 14 days ago
# (20160 minutes), so a poisoned fresh publish has time to be caught/yanked.
# Internal @cuewise/* packages resolve via workspace:* and never hit the
# registry, so no exclude is needed (a scope-wildcard exclude would also let a
# malicious public @cuewise/* publish bypass the cooldown).
minimumReleaseAge: 20160
# TypeScript is a high-profile, heavily-scrutinized Microsoft package; exempt it from
# the cooldown so we can adopt a fresh major without waiting. TS 7 (the native compiler)
# also ships per-platform binaries under @typescript/*, which need the same exemption.
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/*'

# Force patched versions of transitive deps flagged by Dependabot. Major-scoped
# so unrelated majors are untouched. All targets are >14 days old, so they clear
# the minimumReleaseAge cooldown above.
overrides:
  # yaml-language-server holds 2.7.1; even its latest stops at 2.8.3, the first patched release.
  yaml@2: 2.9.0

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

catalog:
  '@astrojs/check': ^0.9.10
  '@astrojs/sitemap': ^3.7.4
  '@biomejs/biome': ^2.5.14
  '@changesets/cli': ^3.0.3
  '@cloudflare/vitest-plugin': ^1.2.6
  '@cloudflare/workers-types': ^5.20260923.1
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@crxjs/vite-plugin': ^3.0.0
  '@playwright/test': ^1.63.0
  '@tailwindcss/postcss': ^4.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/chrome': ^0.3.0
  '@types/node': ^24.13.3
  '@types/react': ^18.3.31
  '@types/react-dom': ^18.3.7
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/coverage-v8': 5.0.1
  '@vitest/ui': 5.0.1
  astro: 7.3.5
  autoprefixer: ^10.6.1
  chrono-node: ^2.10.1
  clsx: ^2.1.1
  date-fns: ^4.4.0
  fishery: ^2.4.0
  hono: ^4.13.9
  jose: ^6.2.12
  jsdom: ^30.1.1
  lucide-react: ^1.48.0
  postcss: ^8.5.28
  react: ^18.3.1
  react-dom: ^18.3.1
  recharts: 3.10.1
  sharp: ^0.35.4
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  turbo: ^2.11.4
  typescript: ^7.0.2
  vite: ^8.3.1
  vitest: 5.0.1
  wrangler: ^4.140.0
  zod: ^4.6.5
  zustand: 5.0.15

catalogs:
  # Astro's check tooling (@astrojs/check) peer-caps at TS 6, so the standalone website
  # stays on 6 here until it supports TS 7; everything else uses the default catalog (7.x).
  astro-ts6:
    typescript: ^6.0.3
  # @cloudflare/vitest-plugin supports vitest 5 from 1.4.0, which clears the release cooldown on
  # 2026-10-22; until then the API (the plugin's only user) stays on vitest 4.
  api-vitest4:
    '@vitest/coverage-istanbul': 4.1.11
    vitest: 4.1.11
