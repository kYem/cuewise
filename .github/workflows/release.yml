name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip release creation and Chrome publish)'
        required: false
        default: false
        type: boolean
      publish_chrome:
        description: 'Publish to Chrome Web Store'
        required: false
        default: false
        type: boolean

# Least privilege by default; each job escalates only what it needs.
permissions:
  contents: read

# Disable build-tool telemetry so nothing phones home from CI
# (Turbo -> telemetry.vercel.com, Astro -> telemetry.astro.build).
env:
  DO_NOT_TRACK: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build and Test
    # Releases only ever run from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # provenance attestation (Sigstore OIDC + upload)
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden runner
        # Block egress (builds + attests the published artifact).
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm --filter @cuewise/browser-extension test

      - name: Build all packages
        run: pnpm build
        env:
          # Public Chrome-Extension OAuth client id (ships in the manifest). When
          # set, the build provisions the Google Calendar integration; empty ->
          # the companion stays hidden. Set as a repo variable, not a secret.
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          # Cloud sync (ENG-43): public repo variables, not secrets. Setting the base URL
          # enables the Cloud Sync UI + points at the backend; the sync client id powers the
          # Sign in with Google flow. Both empty -> cloud sync stays hidden in the release.
          VITE_SYNC_API_BASE_URL: ${{ vars.VITE_SYNC_API_BASE_URL }}
          VITE_GOOGLE_SYNC_CLIENT_ID: ${{ vars.VITE_GOOGLE_SYNC_CLIENT_ID }}
          # Notion's public client id (same value as the Worker's NOTION_CLIENT_ID). Empty ->
          # every Notion surface stays hidden in the release.
          VITE_NOTION_CLIENT_ID: ${{ vars.VITE_NOTION_CLIENT_ID }}

      - name: Build extension zip
        run: pnpm release:extension
        env:
          # release:extension rebuilds the extension (build:store), so these must
          # be present here too — this is the build that gets zipped.
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_SYNC_API_BASE_URL: ${{ vars.VITE_SYNC_API_BASE_URL }}
          VITE_GOOGLE_SYNC_CLIENT_ID: ${{ vars.VITE_GOOGLE_SYNC_CLIENT_ID }}
          VITE_NOTION_CLIENT_ID: ${{ vars.VITE_NOTION_CLIENT_ID }}

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/browser-extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: apps/browser-extension/build/cuewise-extension-${{ steps.version.outputs.version }}.zip

      - name: Upload extension zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cuewise-extension-${{ steps.version.outputs.version }}
          path: apps/browser-extension/build/cuewise-extension-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS app
    needs: build
    runs-on: macos-latest
    # The updater signing key lives ONLY in this environment.
    environment: macos-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        # Audit only: macOS runners have no egress blocking (see ci.yml's `rust` job).
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cargo/Swift caches: a release build signs with this job's key, so it
      # never restores state a PR run could have written.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build posture sidecar
        run: pnpm --filter @cuewise/macos build:sidecar

      # Ad-hoc signed until Apple enrollment (tauri.release.conf.json); the signing key
      # signs the updater archive, which the app verifies against its pubkey.
      - name: Build app bundle
        run: pnpm --filter @cuewise/macos tauri build --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SYNC_API_BASE_URL: ${{ vars.VITE_SYNC_API_BASE_URL }}
          VITE_NOTION_CLIENT_ID: ${{ vars.VITE_NOTION_CLIENT_ID }}

      # latest.json carries the macOS version (what the updater compares) but points into
      # this release's tag, so every release must ship it or `releases/latest` 404s.
      - name: Stage release assets
        env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          VERSION=$(node -p "require('./apps/macos/package.json').version")
          BUNDLE=apps/macos/src-tauri/target/release/bundle
          OUT=dist-macos
          ARCHIVE="Cuewise_${VERSION}_aarch64.app.tar.gz"
          mkdir -p "$OUT"
          cp "$BUNDLE/macos/Cuewise.app.tar.gz" "$OUT/$ARCHIVE"
          cp "$BUNDLE/dmg/Cuewise_${VERSION}_aarch64.dmg" "$OUT/"
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$BUNDLE/macos/Cuewise.app.tar.gz.sig")" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE}" \
            '{version: $version, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$OUT/latest.json"
          ls -l "$OUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist-macos/*.dmg
            dist-macos/*.app.tar.gz

      - name: Upload macOS assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cuewise-macos
          path: dist-macos/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build, macos]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # Block egress (creates the GitHub release).
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443

      # Checkout is needed only for the CHANGELOG used as the release body.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/browser-extension/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download extension zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuewise-extension-${{ needs.build.outputs.version }}
          path: dist-artifact

      - name: Download macOS assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuewise-macos
          path: dist-macos

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ needs.build.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The CHANGELOG holds every version; slice out only this release's section
      # (from its `## <version>` heading to the next one) for the release body,
      # then link back to the full changelog at this tag.
      - name: Extract release notes for this version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Write to the runner temp dir, not the working tree, so the
          # generated notes never need gitignoring.
          NOTES="$RUNNER_TEMP/RELEASE_NOTES.md"
          # Capture from the exact `## <version>` heading up to the next
          # version heading. The boundary requires a semver-shaped heading so a
          # stray `## ...` line inside an entry body can't truncate the notes.
          awk -v ver="## $VERSION" '
            $0 == ver { capture = 1; next }
            capture && /^## [0-9]+\.[0-9]+\.[0-9]+/ { exit }
            capture { print }
          ' apps/browser-extension/CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::warning::No CHANGELOG section found for $VERSION; using a fallback body."
            echo "Cuewise v$VERSION" > "$NOTES"
          fi
          {
            echo ""
            echo "---"
            echo "**Full changelog:** [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/apps/browser-extension/CHANGELOG.md)"
          } >> "$NOTES"

      - name: Create GitHub Release
        if: ${{ steps.check_release.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Cuewise v${{ needs.build.outputs.version }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: |
            dist-artifact/cuewise-extension-${{ needs.build.outputs.version }}.zip
            dist-macos/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to Chrome Web Store
    needs: build
    if: ${{ inputs.publish_chrome && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The CWS tokens live ONLY in this environment. Add a required reviewer to
    # the `chrome-web-store` environment so a human must approve every publish.
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Block egress (holds the store tokens).
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            oauth2.googleapis.com:443
            www.googleapis.com:443

      # Only the first-party publish script is needed — no install, no tsx, so no
      # dependency code ever runs in the job that holds the secrets.
      - name: Checkout publish script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/publish-chrome.mts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Download extension zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuewise-extension-${{ needs.build.outputs.version }}
          path: apps/browser-extension/build

      - name: Publish to Chrome Web Store
        env:
          # Extension ID and Client ID are non-sensitive, stored as variables
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ vars.CHROME_CLIENT_ID }}
          # Client Secret and Refresh Token are sensitive, stored as environment secrets
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node scripts/publish-chrome.mts "apps/browser-extension/build/cuewise-extension-${{ needs.build.outputs.version }}.zip"

  summary:
    name: Summary
    needs: [build, macos, release, publish]
    # Run even if release/publish were skipped (dry run or publish disabled).
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "**Version:** v${{ needs.build.outputs.version }}"
            echo "**Dry Run:** ${{ inputs.dry_run }}"
            echo "**Chrome Publish:** ${{ inputs.publish_chrome }}"
            echo "**macOS job:** ${{ needs.macos.result }}"
            echo "**Release job:** ${{ needs.release.result }}"
            echo "**Publish job:** ${{ needs.publish.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
